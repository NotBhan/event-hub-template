# ---------------------------------------------------------------------------
# Deployment baseline: database + web + worker.
#
# For a client installation, copy `.env.example` to `.env`, fill in the real
# values, then: docker compose up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy or Nginx) in front of `web`. HTTPS
# is not optional: payment webhooks and session cookies depend on it.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-event_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-event_platform}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deployment/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_OWNER_USER:-event_owner} -d ${POSTGRES_DB:-event_platform}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only reachable from the compose network.
    expose:
      - '5432'

  migrate:
    build:
      context: .
      target: migrator
    command: ['npx', 'drizzle-kit', 'migrate']
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4321'
    ports:
      - '127.0.0.1:4321:4321'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Scheduled maintenance: expired reservations, queued email, payment
  # reconciliation. Runs on a loop rather than a per-task cron daemon so the
  # deployment stays dependency-free.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WORKER_INTERVAL_SECONDS: '60'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ['npx', 'tsx', 'workers/scheduler.ts']

volumes:
  db-data:
